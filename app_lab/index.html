<title>IMU Avoider</title>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/roslib@1.3.0/build/roslib.min.js"></script>

<style>
/* ── Layout: 2-col instrument panel, single dark theme ── */
:root {
  --bg:       #080c18;
  --surface:  #0f1626;
  --surface2: #1a2235;
  --border:   rgba(0,210,255,.12);
  --fg:       #dde6f0;
  --dim:      #4e6080;
  --accent:   #00d2ff;
  --safe:     #00e67a;
  --warn:     #ffaa00;
  --danger:   #ff3360;
  --servo:    #a78bfa;
  color-scheme: dark;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  padding-left:  max(16px, env(safe-area-inset-left,  0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
}

/* ── Header ── */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  gap: 12px;
}
h1 {
  margin: 0;
  font-family: 'Orbitron', monospace;
  font-size: 1rem;
  letter-spacing: .12em;
  color: var(--accent);
  text-transform: uppercase;
}
.conn {
  display: flex;
  align-items: center;
  gap: 7px;
  font-family: 'JetBrains Mono', monospace;
  font-size: .7rem;
  color: var(--dim);
}
.dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--dim);
  flex-shrink: 0;
  transition: background .3s, box-shadow .3s;
}
.dot.ok   { background: var(--safe);   box-shadow: 0 0 8px var(--safe); }
.dot.demo { background: var(--warn);   box-shadow: 0 0 8px var(--warn); }
.dot.err  { background: var(--danger); }

/* ── Grid ── */
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
@media (max-width: 520px) { .grid { grid-template-columns: 1fr; } }

/* ── Panel ── */
.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px 16px;
}
.panel.span2 { grid-column: 1 / -1; }
.lbl {
  font-family: 'JetBrains Mono', monospace;
  font-size: .62rem;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--dim);
  margin-bottom: 10px;
}

/* ── State panel ── */
.state-val {
  font-family: 'Orbitron', monospace;
  font-size: 1.75rem;
  font-weight: 700;
  letter-spacing: .1em;
  text-align: center;
  padding: 6px 0 2px;
  transition: color .25s;
}
.state-val.IDLE,
.state-val.FORWARD,
.state-val.BACKWARD,
.state-val.LEFT,
.state-val.RIGHT   { color: var(--accent); }
.state-val.SAFE    { color: var(--safe);   }
.state-val.WARNING { color: var(--warn);   }
.state-val.DANGER  { color: var(--danger); animation: blink .4s ease-in-out infinite alternate; }
@keyframes blink { to { opacity: .45 } }

/* ── Distance arc ── */
.dist-wrap { display: flex; flex-direction: column; align-items: center; }
.dist-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 2rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: var(--fg);
  margin-top: -8px;
  line-height: 1;
}
.dist-unit { font-size: .8rem; color: var(--dim); }

/* ── IMU axis bars ── */
.axis { display: grid; grid-template-columns: 36px 1fr 56px; align-items: center; gap: 8px; margin-bottom: 9px; }
.axis:last-child { margin-bottom: 0; }
.axis-name { font-family: 'JetBrains Mono', monospace; font-size: .68rem; color: var(--dim); }
.track { height: 5px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
.fill  { height: 100%; border-radius: 3px; transition: width .1s; }
.axis-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: .72rem;
  font-variant-numeric: tabular-nums;
  text-align: right;
  color: var(--fg);
}

/* ── Servo & pose ── */
.servo-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 2rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: var(--servo);
  text-align: center;
  margin-top: -4px;
}
.pose-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pose-row  { }
.pose-key  { font-family: 'JetBrains Mono', monospace; font-size: .62rem; letter-spacing: .1em; color: var(--dim); text-transform: uppercase; }
.pose-val  { font-family: 'JetBrains Mono', monospace; font-size: 1.1rem; font-variant-numeric: tabular-nums; color: var(--fg); }
.pose-row.full { grid-column: 1 / -1; }
.pose-row.full .pose-val { color: var(--accent); }
</style>

<!-- ── Header ── -->
<header>
  <h1>IMU&#8201;Avoider</h1>
  <div class="conn">
    <div class="dot" id="dot"></div>
    <span id="connTxt">Connecting…</span>
  </div>
</header>

<!-- ── Dashboard grid ── -->
<div class="grid">

  <!-- State -->
  <div class="panel">
    <div class="lbl">System State</div>
    <div class="state-val IDLE" id="stateEl">IDLE</div>
  </div>

  <!-- Distance -->
  <div class="panel">
    <div class="lbl">Obstacle Distance</div>
    <div class="dist-wrap">
      <svg viewBox="0 0 180 96" width="100%" style="max-width:180px">
        <!-- Track -->
        <path d="M14,86 A72,72 0 0,1 166,86"
              fill="none" stroke="var(--surface2)" stroke-width="11" stroke-linecap="round"/>
        <!-- Fill -->
        <path id="distArc" d="M14,86 A72,72 0 0,1 166,86"
              fill="none" stroke="var(--safe)" stroke-width="11" stroke-linecap="round"
              stroke-dasharray="226" stroke-dashoffset="226"
              style="transition:stroke-dashoffset .2s,stroke .3s"/>
        <!-- Tick marks -->
        <text x="10"  y="98" font-family="JetBrains Mono,monospace" font-size="9" fill="var(--danger)" text-anchor="middle">0</text>
        <text x="90"  y="20" font-family="JetBrains Mono,monospace" font-size="9" fill="var(--dim)"    text-anchor="middle">2m</text>
        <text x="168" y="98" font-family="JetBrains Mono,monospace" font-size="9" fill="var(--safe)"  text-anchor="middle">4</text>
      </svg>
      <div class="dist-num" id="distNum">—<span class="dist-unit"> m</span></div>
    </div>
  </div>

  <!-- IMU -->
  <div class="panel span2">
    <div class="lbl">IMU Orientation · Filtered</div>
    <div class="axis">
      <span class="axis-name">Roll</span>
      <div class="track"><div class="fill" id="rollFill" style="width:50%;background:var(--accent)"></div></div>
      <span class="axis-num" id="rollNum">0.0°</span>
    </div>
    <div class="axis">
      <span class="axis-name">Pitch</span>
      <div class="track"><div class="fill" id="pitchFill" style="width:50%;background:var(--safe)"></div></div>
      <span class="axis-num" id="pitchNum">0.0°</span>
    </div>
    <div class="axis">
      <span class="axis-name">Yaw</span>
      <div class="track"><div class="fill" id="yawFill" style="width:50%;background:var(--servo)"></div></div>
      <span class="axis-num" id="yawNum">0.0°</span>
    </div>
  </div>

  <!-- Servo -->
  <div class="panel">
    <div class="lbl">Servo Angle</div>
    <svg viewBox="0 0 120 56" width="100%" style="max-width:150px;display:block;margin:0 auto">
      <path d="M8,50 A52,52 0 0,1 112,50"
            fill="none" stroke="var(--surface2)" stroke-width="8" stroke-linecap="round"/>
      <path id="servoArc" d="M8,50 A52,52 0 0,1 112,50"
            fill="none" stroke="var(--servo)" stroke-width="8" stroke-linecap="round"
            stroke-dasharray="163" stroke-dashoffset="81"
            style="transition:stroke-dashoffset .2s"/>
      <line id="needle" x1="60" y1="50" x2="60" y2="8"
            stroke="var(--servo)" stroke-width="2.5" stroke-linecap="round"
            style="transform-origin:60px 50px;transition:transform .2s"/>
      <circle cx="60" cy="50" r="4" fill="var(--surface2)" stroke="var(--servo)" stroke-width="2"/>
    </svg>
    <div class="servo-num" id="servoNum">90°</div>
  </div>

  <!-- Turtle pose -->
  <div class="panel">
    <div class="lbl">Turtle Pose</div>
    <div class="pose-grid">
      <div class="pose-row">
        <div class="pose-key">X</div>
        <div class="pose-val" id="poseX">—</div>
      </div>
      <div class="pose-row">
        <div class="pose-key">Y</div>
        <div class="pose-val" id="poseY">—</div>
      </div>
      <div class="pose-row full">
        <div class="pose-key">Heading</div>
        <div class="pose-val" id="poseTheta">—</div>
      </div>
    </div>
  </div>

</div><!-- /grid -->

<script>
// ── Config: ROS bridge URL
// 하드웨어 모드: 'ws://localhost:9090'  (UNO Q 내부 실행 시)
// WiFi 원격:    'ws://<UNO-Q-IP>:9090'
const ROS_URL = 'ws://localhost:9090';

const R2D = 180 / Math.PI;

// ── Helpers ──────────────────────────────────────────────
function setAxis(prefix, deg) {
  document.getElementById(prefix + 'Num').textContent = deg.toFixed(1) + '°';
  const pct = Math.min(100, Math.max(0, (deg / 90) * 50 + 50));
  document.getElementById(prefix + 'Fill').style.width = pct + '%';
}

function setDist(r) {
  const clamped = Math.min(r, 4);
  document.getElementById('distNum').innerHTML =
    clamped.toFixed(2) + '<span class="dist-unit"> m</span>';
  const offset = 226 - (clamped / 4) * 226;
  const arc = document.getElementById('distArc');
  arc.setAttribute('stroke-dashoffset', offset.toFixed(1));
  arc.setAttribute('stroke',
    clamped < 0.30 ? 'var(--danger)' :
    clamped < 0.60 ? 'var(--warn)'   : 'var(--safe)');
}

function setServo(deg) {
  document.getElementById('servoNum').textContent = Math.round(deg) + '°';
  const offset = 163 - (deg / 180) * 163;
  document.getElementById('servoArc').setAttribute('stroke-dashoffset', offset.toFixed(1));
  document.getElementById('needle').style.transform = `rotate(${deg - 90}deg)`;
}

function setState(s) {
  const el = document.getElementById('stateEl');
  el.textContent = s;
  el.className = 'state-val ' + s;
}

function quatToEuler(x, y, z, w) {
  const roll  = Math.atan2(2*(w*x + y*z), 1 - 2*(x*x + y*y));
  const sinp  = 2*(w*y - z*x);
  const pitch = Math.abs(sinp) >= 1 ? Math.sign(sinp) * Math.PI / 2 : Math.asin(sinp);
  const yaw   = Math.atan2(2*(w*z + x*y), 1 - 2*(y*y + z*z));
  return { roll, pitch, yaw };
}

// ── Demo mode (runs when ROS bridge unreachable) ─────────
let demoT = 0, demoInterval = null;
function startDemo() {
  if (demoInterval) return;
  demoInterval = setInterval(() => {
    demoT += 0.04;
    const roll  = 25 * Math.sin(0.5 * demoT);
    const pitch = 15 * Math.sin(0.3 * demoT + 1);
    const yaw   = (demoT * 8) % 360 - 180;
    const dist  = 0.85 + 0.65 * Math.sin(0.15 * demoT);
    const servo = 90 + 70 * Math.sin(0.4 * demoT);
    setAxis('roll', roll); setAxis('pitch', pitch); setAxis('yaw', yaw);
    setDist(dist);
    setServo(servo);
    const s = dist < 0.3 ? 'DANGER' : dist < 0.6 ? 'WARNING' :
              pitch < -5 ? 'FORWARD' : pitch > 5 ? 'BACKWARD' : 'IDLE';
    setState(s);
    document.getElementById('poseX').textContent = (5.5 + 2 * Math.sin(0.2*demoT)).toFixed(2);
    document.getElementById('poseY').textContent = (5.5 + 2 * Math.cos(0.2*demoT)).toFixed(2);
    document.getElementById('poseTheta').textContent = (yaw).toFixed(1) + '°';
  }, 50);
}
function stopDemo() {
  clearInterval(demoInterval);
  demoInterval = null;
}

// ── ROS 2 connection ─────────────────────────────────────
const dot     = document.getElementById('dot');
const connTxt = document.getElementById('connTxt');

const ros = new ROSLIB.Ros({ url: ROS_URL });

ros.on('connection', () => {
  dot.className = 'dot ok';
  connTxt.textContent = 'ROS 2 연결됨';
  stopDemo();
  subscribe();
});
ros.on('error', () => {
  dot.className = 'dot demo';
  connTxt.textContent = 'Demo 모드';
  startDemo();
});
ros.on('close', () => {
  dot.className = 'dot demo';
  connTxt.textContent = 'Demo 모드';
  startDemo();
});

function subscribe() {
  // /imu/filtered
  new ROSLIB.Topic({ ros, name: '/imu/filtered',
    messageType: 'sensor_msgs/Imu' }).subscribe(msg => {
    const { x, y, z, w } = msg.orientation;
    if (msg.orientation_covariance[0] < 0) return;
    const e = quatToEuler(x, y, z, w);
    setAxis('roll',  e.roll  * R2D);
    setAxis('pitch', e.pitch * R2D);
    setAxis('yaw',   e.yaw   * R2D);
  });

  // /ultrasonic/range
  new ROSLIB.Topic({ ros, name: '/ultrasonic/range',
    messageType: 'sensor_msgs/Range' }).subscribe(msg => {
    setDist(msg.range);
  });

  // /led/cmd
  new ROSLIB.Topic({ ros, name: '/led/cmd',
    messageType: 'std_msgs/String' }).subscribe(msg => {
    setState(msg.data);
  });

  // /servo/angle
  new ROSLIB.Topic({ ros, name: '/servo/angle',
    messageType: 'std_msgs/Float32' }).subscribe(msg => {
    setServo(msg.data);
  });

  // /turtle1/pose
  new ROSLIB.Topic({ ros, name: '/turtle1/pose',
    messageType: 'turtlesim/Pose' }).subscribe(msg => {
    document.getElementById('poseX').textContent = msg.x.toFixed(2);
    document.getElementById('poseY').textContent = msg.y.toFixed(2);
    document.getElementById('poseTheta').textContent = (msg.theta * R2D).toFixed(1) + '°';
  });
}

// 첫 로드에서 짧게 연결 대기 후 demo 시작
setTimeout(() => { if (!demoInterval && dot.className === 'dot') startDemo(); }, 2000);
</script>
